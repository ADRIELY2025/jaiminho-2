{% extends "main.html" %}

{% block main %}
<div class="container mt-5">
  <div class="card shadow-sm">
    <div class="card-header">
      <h4 class="mb-0">Cadastro de Cliente</h4>
    </div>
    <div class="card-body">
      <form class="row g-3 needs-validation" novalidate>
        <div class="col-md-6">
          <label for="validationServer01" class="form-label">Nome</label>
          <input type="text" class="form-control" id="validationServer01" required>
          <div class="invalid-feedback">Por favor, informe seu nome.</div>
        </div>
        <div class="col-md-6">
          <label for="validationServer02" class="form-label">Sobrenome</label>
          <input type="text" class="form-control" id="validationServer02" required>
          <div class="invalid-feedback">Por favor, informe seu sobrenome.</div>
        </div>
        <div class="col-md-6">
          <label for="validationServerUsername" class="form-label">Telefone</label>
          <div class="input-group has-validation">
            <input type="text" class="form-control" id="validationServerUsername" required>
            <div class="invalid-feedback">Por favor, escolha um nome de usuário.</div>
          </div>
        </div>
        <div class="col-md-6">
          <label for="validationServer05" class="form-label">CEP</label>
          <input type="text" class="form-control" id="validationServer05" required>
          <div class="invalid-feedback">Por favor, forneça um CEP válido.</div>
        
            <input class="form-check-input" type="checkbox" id="invalidCheck3" required>
            <label class="form-check-label" for="invalidCheck3">
              Concordo com os termos e condições
            </label>
            <div class="invalid-feedback">Você precisa concordar antes de enviar.</div>
          </div>
        </div>
        <div class="col-1  mt-3">
          <button class="btn btn-success px-4" type="submit">Enviar</button>
        </div>
        <div class="col-1  mt-3">
          <button class="btn btn-danger px-4" href="/home" type="submit">Voltar</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
